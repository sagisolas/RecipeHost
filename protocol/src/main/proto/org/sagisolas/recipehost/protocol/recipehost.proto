syntax = "proto3";

package org.sagisolas.recipehost.protocol;

option java_package = "org.sagisolas.recipehost.protocol";
option java_multiple_files = true;

// Top-level framed message exchanged over a Session.
message Envelope {
  oneof payload {
    Handshake handshake = 1;
    ItemBatch item_batch = 2;
    RecipeBatch recipe_batch = 3;
    IconBatch icon_batch = 4;
    Done done = 5;
    Error error = 6;
    Auth auth = 7;
    LayoutBatch layout_batch = 8;
  }
}

// First Envelope the mobile app sends on connect. Authenticates the Session
// against the 256-bit token shown on the QR screen.
message Auth {
  bytes token = 1;
}

// First Envelope the companion mod sends after accepting a Token.
message Handshake {
  uint32 protocol_version = 1;
  string minecraft_version = 2;
  string locale = 3;
  repeated ModInfo mods = 4;
  uint32 total_items = 5;
  uint32 total_recipes = 6;
  string instance_name = 7;        // game-directory folder name, see Instance in GLOSSARY.md
}

// Sent for every namespace that owns at least one Item or Recipe. A namespace
// with no loaded mod behind it (a datapack) carries version "datapack".
message ModInfo {
  string id = 1;
  string name = 2;
  string version = 3;
}

message ItemBatch {
  repeated Item items = 1;
}

message Item {
  string id = 1;           // namespaced id, e.g. "minecraft:stick"
  string display_name = 2; // localized via the mod's locale (see Handshake)
}

message RecipeBatch {
  repeated Recipe recipes = 1;
}

message Recipe {
  string type_id = 1;              // e.g. "minecraft:crafting_shaped"
  repeated Slot inputs = 2;
  repeated ItemStack results = 3;
  map<string, string> extras = 4;  // type-specific metadata, see ADR 0002
  string id = 5;                   // recipe id, e.g. "minecraft:oak_planks"; its namespace owns the recipe (ADR 0011)
  // One entry per RecipeSlot of the recipe's layout, in slot order; empty when the
  // recipe has no layout. Display only: `inputs` and `results` stay the semantic truth.
  repeated Slot layout_stacks = 6;
}

message Slot {
  repeated ItemStack stacks = 1;   // expanded ingredient alternatives
}

message ItemStack {
  string item_id = 1;
  uint32 count = 2;                // 0 interpreted as 1
}

// One Icon atlas: a PNG sheet of square cells, `columns` per row, holding the
// Icons of `item_ids` in row-major order (cell i is item_ids[i]). The sheet is
// columns * cell_size wide and only as many rows tall as it needs.
message IconBatch {
  reserved 1;                      // was: repeated Icon icons (protocol v1)
  bytes png = 2;
  uint32 cell_size = 3;            // px, 16
  uint32 columns = 4;
  repeated string item_ids = 5;
}

// Recipe layouts, sent after every RecipeBatch, interleaved with or after the
// IconBatches. Each key is sent once per Snapshot with its png; a later entry
// for an already-sent key has an empty png and only adds recipe_ids.
message LayoutBatch {
  repeated RecipeLayout layouts = 1;
}

// An image of a recipe's GUI as the game draws it, minus the Items inside its
// slots, plus those slots' rectangles (see Recipe layout in GLOSSARY.md).
message RecipeLayout {
  string key = 1;
  bytes png = 2;
  uint32 width = 3;                // GUI px
  uint32 height = 4;               // GUI px
  repeated RecipeSlot slots = 5;   // order is significant: Recipe.layout_stacks fills them by index
  repeated string recipe_ids = 6;  // recipes in this Snapshot that use the layout; each at most once per Snapshot
}

// A slot rectangle inside a RecipeLayout, in GUI px from its top-left corner.
message RecipeSlot {
  enum Role {
    INPUT = 0;
    OUTPUT = 1;
    CATALYST = 2;
  }
  uint32 x = 1;
  uint32 y = 2;
  uint32 width = 3;
  uint32 height = 4;
  Role role = 5;
}

message Done {}

message Error {
  ErrorCode code = 1;
}

enum ErrorCode {
  UNSPECIFIED = 0;
  UNAUTHORIZED = 1;
  BUSY = 2;
  SOURCE_FAILURE = 3;
}
