#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
# Disabled: Architectury Loom 1.9's RemapJarTask holds a Project reference
# and is not configuration-cache compatible. Re-enable after upgrading Loom
# (fixed in 1.10+) or after Arch Loom publishes a CC-safe release.
org.gradle.configuration-cache=false
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# Mod Properties
mod_version=1.0.0
mod_minecraft_version=1.21.1
mod_loader_version=0.20.1
mod_fabric_api_version=0.116.18+1.21.1
mod_neoforge_version=21.1.77
mod_emi_version=1.1.24+1.21.1
mod_dev_emi=true

# Mod download pages, linked from the app's Welcome screen
mod_modrinth_url=https://modrinth.com/mod/recipehost
mod_curseforge_url=https://www.curseforge.com/minecraft/mc-mods/recipehost

# App info, shown in the footer of the app's Settings screen, and in mod metadata
app_version=1.0.0
author=Vladislav Izbash
author_email=sagisolas@pm.me
source_url=https://github.com/sagisolas/RecipeHost
issues_url=https://github.com/sagisolas/RecipeHost/issues
